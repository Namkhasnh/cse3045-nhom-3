{
  "openapi": "3.1.0",
  "info": {
    "title": "Hoa Lac Food accounts, catalog, orders, payments, finance and scoped administration API",
    "version": "0.6.0",
    "description": "V0.6 direct QR/refunds plus preserved V0.5 cash contracts; isolated synthetic local acceptance only. Examples never prove real partner/survey/consent/transactions. No retained-data migration or production authorization. October25 COD cutover: owner-only new vouchers; legacy facts retained. See docs/cod-ordering.md."
