{
  "openapi": "3.1.0",
  "info": {
    "title": "Hoa Lac Food V0.1 account API",
    "version": "0.1.0",
    "description": "Accepted V0.1 auth/profile scope only. Existing public catalog is reviewed separately in P04; later business APIs are excluded. JSON syntax is valid YAML 1.2 and permits dependency-free document parsing. IDs remain strings. No website privilege grant/enrollment route exists."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
    "/auth/register": {
      "post": {
        "operationId": "register",
        "summary": "register",
        "description": "Create only an ordinary user. Email verification is required before login; SMTP failure can leave a pending account for resend.",
        "tags": [
          "V0.1 accounts"
        ],
        "security": [],
        "responses": {
          "201": {
            "description": "Successful register",
            "headers": {
              "Cache-Control": {
                "description": "Never cache auth/profile responses.",
                "schema": {
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UserEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Register"
              }
            }
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Origin"
          }
        ]
      }
    },
    "/auth/verify-email": {
      "post": {
        "operationId": "verifyEmail",
        "summary": "verifyEmail",
        "description": "Code expires after ten minutes or five wrong attempts. Successful verification clears the code and grants no session.",
        "tags": [
          "V0.1 accounts"
        ],
        "security": [],
        "responses": {
          "200": {
            "description": "Successful verifyEmail",
            "headers": {
              "Cache-Control": {
                "description": "Never cache auth/profile responses.",
