    "/restaurants": {
      "get": {
        "operationId": "publicRestaurantList",
        "summary": "Public restaurant list",
        "description": "Anonymous; no auth/me dependency. Active ready restaurants and visible dishes only. Unknown query keys, repeated fields, unsupported sort/filter or malformed scalars return 422. Lists are live, not snapshots. Closed restaurants and sold-out visible dishes remain readable.",
        "tags": [
          "V0.2 public catalog"
        ],
        "security": [],
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Page size; encoded as canonical decimal query text.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque signed live keyset cursor, bound to resource, filters, sort and limit. Invalid/mismatched cursor returns 422.",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "description": "Ascending numeric ID breaks ties, including descending sorts.",
            "schema": {
              "type": "string",
              "enum": [
                "name",
                "-name"
              ],
              "default": "name"
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "description": "Nonblank trimmed name prefix; utf8mb4_0900_ai_ci, case/diacritic insensitive; literal % and _.",
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          },
          {
            "name": "category_id",
            "in": "query",
            "required": false,
            "description": "Visible-dish category.",
            "schema": {
              "$ref": "#/components/schemas/Id"
            }
          },
          {
            "name": "min_price_vnd",
            "in": "query",
            "required": false,
            "description": "Inclusive lower price bound; minimum <= maximum.",
            "schema": {
              "$ref": "#/components/schemas/CatalogMoney"
            }
          },
          {
            "name": "max_price_vnd",
            "in": "query",
            "required": false,
            "description": "Inclusive upper price bound. Restaurant filters must match the same visible dish.",
            "schema": {
              "$ref": "#/components/schemas/CatalogMoney"
            }
          },
          {
            "name": "is_open",
            "in": "query",
            "required": false,
            "description": "Literal true/false. Sold-out and closed resources remain readable without this filter.",
            "schema": {
              "type": "boolean"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Public allowlisted projection; no session needed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RestaurantList"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    },
