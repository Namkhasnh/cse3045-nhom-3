    "/auth/login": {
      "post": {
        "operationId": "login",
        "summary": "login",
        "description": "Buyer/manager success issues cookies. Admin password success only issues a restricted five-minute challenge and no cookies. Five password failures per username/IP in fifteen minutes cause backoff.",
        "tags": [
          "V0.1 accounts"
        ],
        "security": [],
        "responses": {
          "200": {
            "description": "Successful login",
            "headers": {
              "Cache-Control": {
                "description": "Never cache auth/profile responses.",
                "schema": {
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Set-Cookie": {
                "description": "Success with a session sets two __Host- cookies (Secure, SameSite=Lax, Path=/, 15 minutes); access is HttpOnly, CSRF readable. Challenge/recovery sets none; logout clears both.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
