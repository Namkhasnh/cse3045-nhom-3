# Synthetic local acceptance only. No retained/production data or credentials.
services:
  mysql:
    image: mysql:9.2.0
    environment:
      MYSQL_ROOT_PASSWORD: synthetic-v03-only
      MYSQL_DATABASE: test_onboarding
    ports:
      - '127.0.0.1:43316:3306'
    volumes:
      - mysql-test:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: synthetic-v03
      MINIO_ROOT_PASSWORD: synthetic-v03-storage-only
    ports:
      - '127.0.0.1:43317:9000'
    volumes:
      - evidence-test:/data
volumes:
  mysql-test:
  evidence-test:
