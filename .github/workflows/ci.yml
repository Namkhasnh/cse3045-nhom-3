name: CI

on:
  pull_request:
    branches: [main, hw1]
  push:
    branches: [main, hw1]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Build
        run: npm run build

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: local_test_only
          MYSQL_DATABASE: test_hlf
          MYSQL_USER: hlf_test
          MYSQL_PASSWORD: local_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -plocal_test_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://hlf_test:local_test_only@127.0.0.1:3306/test_hlf
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Real MySQL audit and auth integration
        run: npm run test:integration
