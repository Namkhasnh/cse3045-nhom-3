name: CI

on:
  pull_request:
    branches: [main, hw1]
  push:
    branches: [main, hw1]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Cart unit tests
        run: npm run test:cart
      - name: Durable checkout and polling unit tests
        run: npm run test:orders
      - name: Finance intent and exact reporting unit tests
        run: npm run test:finance-unit
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Build
        run: npm run build

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:9.2.0
        env:
          MYSQL_ROOT_PASSWORD: local_test_only
          MYSQL_DATABASE: test_hlf
          MYSQL_USER: hlf_test
          MYSQL_PASSWORD: local_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -plocal_test_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://hlf_test:local_test_only@127.0.0.1:3306/test_hlf
      ONBOARDING_LOCAL_TEST: 'true'
      ONBOARDING_S3_ENDPOINT: http://127.0.0.1:9000
      ONBOARDING_S3_ACCESS_KEY: synthetic-ci
      ONBOARDING_S3_SECRET_KEY: synthetic-ci-storage-only
      ONBOARDING_S3_BUCKET: onboarding-test
      MEDIA_LOCAL_TEST: 'true'
      MEDIA_S3_ENDPOINT: http://127.0.0.1:9000
      MEDIA_S3_ACCESS_KEY: synthetic-ci
      MEDIA_S3_SECRET_KEY: synthetic-ci-storage-only
      MEDIA_S3_BUCKET: dishes-test
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start private synthetic object storage
        run: |
          docker build -t hlf-test-minio:2025-09-07 test/minio
          docker run -d --name hlf-ci-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=synthetic-ci -e MINIO_ROOT_PASSWORD=synthetic-ci-storage-only hlf-test-minio:2025-09-07 server /data
          node --input-type=module -e 'for(let i=0;i<30;i++){try{if((await fetch("http://127.0.0.1:9000/minio/health/ready")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
      - name: Real MySQL auth/catalog/onboarding and private storage integration
        run: npm run test:integration

      - name: P25 restricted SQL and HTTP obligations
        env:
          TEST_DATABASE_URL: mysql://root:local_test_only@127.0.0.1:3306/test_hlf
        run: node test/administration-permissions.mjs

  deployment-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Deployment safety tests
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py' -v
      - name: Build disposable deployment operator
        run: docker build --platform linux/amd64 -f ops/staging/Dockerfile --target schema-operator -t hlf-ci-schema-check .
      - name: Build and smoke compact backend runtime
        run: |
          docker build --platform linux/amd64 -f ops/staging/Dockerfile --target backend-runtime -t hlf-ci-backend-check .
          python3 ops/deploy/check_images.py --backend hlf-ci-backend-check --schema hlf-ci-schema-check
      - name: Real MySQL deployment recovery rehearsal
        run: |
          python3 ops/deploy/integration.py --schema-image hlf-ci-schema-check
          python3 ops/deploy/integration.py --schema-image hlf-ci-schema-check --profile-migration

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/hw1' && github.repository == 'Namkhasnh/cse3045-nhom-3'
    needs: [frontend, backend, mysql-integration, deployment-tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Authenticate GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
      - name: Build and publish tested commit
        run: python3 ops/deploy/publish.py
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
